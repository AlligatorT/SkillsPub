name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.20
          registry-url: https://registry.npmjs.org

      - name: Tag must match package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          [ "$tag" = "$pkg" ] || { echo "tag $GITHUB_REF_NAME != package.json $pkg"; exit 1; }

      - run: npm ci

      # prepublishOnly runs the full release preflight:
      # typecheck, tests, build, audit:release, check:package
      # setup-node may inject NODE_AUTH_TOKEN=XXXXX-...; even an empty value
      # counts as set and blocks OIDC trusted publishing. Unset it in-shell.
      - name: Publish to npm (OIDC trusted publishing)
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public
